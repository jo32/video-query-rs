name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar
          - os: macos-15
            target: aarch64-apple-darwin
            format: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            format: tar
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust target
        shell: bash
        run: |
          rustup update stable
          rustup target add "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.format == 'tar'
        shell: bash
        run: |
          base="vq-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "staging/${base}" dist
          cp "target/${{ matrix.target }}/release/vq" "staging/${base}/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "staging/${base}/"
          tar -C staging -czf "dist/${base}.tar.gz" "${base}"
      - name: Package Windows binary
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $base = "vq-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "staging/$base", "dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vq.exe" "staging/$base/"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md "staging/$base/"
          Compress-Archive -Path "staging/$base" -DestinationPath "dist/$base.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: vq-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "video-query-rs $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
