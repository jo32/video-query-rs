[package]
name = "video-sherlock"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Evidence-backed video understanding for coding agents"
repository = "https://github.com/jo32/video-sherlock"
readme = "README.md"
rust-version = "1.91"

[[bin]]
name = "vq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
flate2 = "1.1.5"
hf-hub = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = "0.18.6"
rayon = "1.12.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.23.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
ureq = "3.3.0"
walkdir = "2.5.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.1", features = ["accelerate"] }

[profile.release]
codegen-units = 1
lto = "thin"
